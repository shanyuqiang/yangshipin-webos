<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/tv-shell.css"><script src="/adapter.js"></script><script src="/tv-shell.js"></script>
<style>body{font:24px sans-serif}.header-b-r-item5{position:absolute;left:900px;top:50px;width:150px;height:60px}.winA-mask-unLogin{display:none;position:absolute;left:850px;top:120px}.winA-mask-unLogin-bottom-img{width:250px;height:70px}.ysplogin-signin{display:none;position:absolute;left:300px;top:160px;width:500px;background:#eee;padding:20px}.ysplogin-signin div{min-height:36px;margin:12px}input{font:24px sans-serif}</style>
<div id="app"><div class="tv-main-con-l-vid"><div id="player"><video></video></div></div></div>
<div class="header-fixed"><span id="desktop-nav">官网导航</span><div class="header-b-r-item5">账号</div></div>
<div class="winA-mask-unLogin"><div class="winA-mask-unLogin-bottom-img">登录</div></div>
<div class="ysplogin-signin"><div class="ysplogin-signin-iptmb"><input aria-label="手机号"></div><div class="ysplogin-signin-iptvc"><input aria-label="验证码"></div><div class="ysplogin-signin-agree-chickable">协议</div><div class="ysplogin-signin-vcsend">获取验证码</div><div class="ysplogin-signin-btnmb">登录</div><div class="ysplogin-signin-close">关闭</div></div>
<script>
var header=document.querySelector('.header-b-r-item5'),menu=document.querySelector('.winA-mask-unLogin');
header.addEventListener('mouseenter',function(){menu.style.display='block';});
header.addEventListener('mouseleave',function(){menu.style.display='none';});
header.addEventListener('click',function(){document.body.dataset.membership='unexpected';});
document.querySelector('.winA-mask-unLogin-bottom-img').addEventListener('click',function(){menu.style.display='none';document.querySelector('.ysplogin-signin').style.display='block';});
document.querySelector('.ysplogin-signin-agree-chickable').addEventListener('click',function(){document.body.dataset.agreed='yes';});
document.querySelector('.ysplogin-signin-vcsend').addEventListener('click',function(){document.body.dataset.sms='sent';});
document.querySelector('.ysplogin-signin-close').addEventListener('click',function(){document.querySelector('.ysplogin-signin').style.display='none';});
window.closedByApp = 0;
window.close = () => { window.closedByApp++; };
</script>
<script>
window.calls = [];
const channels = [[{pid:'1',channelName:'CCTV1',parseDateList1:[{day:'11/14',fullDay:'20261114'},{day:'11/15',fullDay:'20261115'}]},{pid:'2',channelName:'CCTV2'}],[{pid:'3',channelName:'湖南卫视'}]];
function player(label) {
  const controlBar = {
    qualityList:[{fn:'fhd',cname:'蓝光',name:'1080P'},{fn:'shd',cname:'超清',name:'720P'}],
    setQuality(option){calls.push('quality:'+label+':'+option.fn);}
  };
  return {currDef:'fhd', myPoster:{$refs:{controlBar}}};
}
const vm = {
  tvTabs:channels, tvIndex:channels[0][0], selectIndex:0,
  $refs:{player:player('initial')},
  changeIndex(index){this.selectIndex=index;calls.push('group:'+index);},
  changeTV(channel){this.tvIndex=channel;calls.push('channel:'+channel.pid);},
  jiemuNowDate:'20261114', jiemudanInfo:[{startTime:'00:00',name:'第一条'},{startTime:'01:00',name:'第二条',sta:2},{startTime:'02:00',name:'第三条'},{startTime:'03:00',name:'第四条'}],
  changeDay(day){this.jiemuNowDate=day;calls.push('date:'+day);}, $watch(){return function(){};}
};
window.replacePlayer = () => { vm.$refs.player = player('replacement'); };
if (location.search !== '?pending') document.querySelector('#app').__vue__ = vm;
</script>
<script>
if (location.search === '?standalone') {
  vm.retryPlayback = () => calls.push('retry:'+vm.tvIndex.pid);
  window.yspStandaloneTV = vm;
  window.yspLogin = {default:{
    isSigned: () => Promise.resolve(false),
    signin: () => {
      document.body.classList.remove('tv-shell-account');
      document.querySelector('.ysplogin-signin').style.display = 'block';
    }
  }};
}
</script>
