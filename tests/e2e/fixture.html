<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Official DOM fixture</title>
<script src="/adapter.js"></script>
<style>
body{font:24px sans-serif;margin:0}.channels{display:flex;position:absolute;left:100px;top:150px;gap:40px}
.tv-main-con-r-list-left-imga{width:180px;height:80px;background:#ddd;display:flex;align-items:center;justify-content:center}
video{position:absolute;left:100px;top:280px;width:320px;height:180px;background:#111}
</style></head><body>
<output id="channel">CCTV1</output>
<div class="channels"><div class="tv-main-con-r-list-left-imga" data-channel="CCTV1">CCTV1</div><div class="tv-main-con-r-list-left-imga" data-channel="CCTV2">CCTV2</div></div>
<video></video>
<script>
document.querySelectorAll('[data-channel]').forEach(function(element){
  element.addEventListener('click',function(){document.getElementById('channel').textContent=element.dataset.channel;});
});
</script></body></html>
